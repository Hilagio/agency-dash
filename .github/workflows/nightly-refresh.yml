# Nightly data refresh — keeps every account fresh without anyone clicking.
#
# The deploy branch is this repo's default branch, so this scheduled workflow
# fires from it. It pulls the recent window (conversions mature within ~7 days,
# so 14 days is plenty; historical days don't change) and recomputes signals.
# The one-time 90-day history load is done from the portfolio "Backfill all"
# button.
#
# Setup (once): add repository secrets under
#   Settings → Secrets and variables → Actions
#   - CRON_SECRET : the SAME value you set as CRON_SECRET on Railway
#   - APP_URL     : optional; defaults to the production URL below
#
# NOTE: these endpoints require the CRON_SECRET bearer token. Without it they
# redirect to /login. The steps below FAIL LOUDLY on that (assert HTTP 200 and
# reject a login redirect) so a misconfigured secret can't look like success.
name: Nightly data refresh

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily (~04:00 in NL) — well before the team starts, so an ingest hiccup never coincides with the workday
  workflow_dispatch: {}    # allow manual runs from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL || 'https://agency-dash-production.up.railway.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check out the repo (for .github/scripts/cron-call.sh)
        uses: actions/checkout@v5

      - name: Preflight — CRON_SECRET must be set
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is empty. Add it under Settings → Secrets and variables → Actions with the SAME value as Railway's CRON_SECRET, or the nightly refresh does nothing."
            exit 1
          fi

      - name: Ingest Google Ads spine + Shopify orders (last 14 days, one account per request)
        run: |
          # ONE account per request. Batching accounts into a single request
          # accumulated memory and crashed the container mid-nightly (Railway
          # "Deploy Crashed", brief downtime) — every account ingests fine solo.
          # A single account that still crashes is skipped with a warning
          # naming it; the sweep and the rest of the pipeline continue.
          bash .github/scripts/cron-batch.sh "$APP_URL/api/diagnostics/ingest" 14 1 400

      - name: Recompute signals (fills the portfolio red/yellow/green + numbers)
        run: |
          bash .github/scripts/cron-call.sh "$APP_URL/api/diagnostics/run-signals" '' 600

      - name: Generate morning briefings (one-line agent openers per flagged account)
        run: |
          bash .github/scripts/cron-call.sh "$APP_URL/api/diagnostics/briefings" '' 600

      - name: Build the worklist (agent investigates each flagged account → ranked next action)
        run: |
          bash .github/scripts/cron-call.sh "$APP_URL/api/diagnostics/worklist" '' 900
