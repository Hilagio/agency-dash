# Shopify app configuration for "Ecomtrada Analytics".
#
# You do NOT have to use the CLI. This file just mirrors the boxes on the
# dashboard "Create version" page, so it's a reference for the exact values.
# (If you ever DO want to push it automatically: `shopify app config link`
# then `shopify app deploy`.)
#
# Read-only analytics connection: minimal scopes, no customer PII, never writes.

client_id = "06a4ee083d2602675e9f9a457936deb9"
name = "Ecomtrada Analytics"
application_url = "https://agency-dash-production.up.railway.app"
embedded = false

[access_scopes]
# Everything the tool uses — nothing more. Mirror in Railway's SHOPIFY_SCOPES.
scopes = "read_orders,read_products"
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://agency-dash-production.up.railway.app/api/shopify/callback"
]

[webhooks]
api_version = "2026-07"

# The three mandatory GDPR compliance webhooks — all handled by
# src/app/api/shopify/webhooks/route.ts (HMAC-verified). We hold no per-customer
# data, so they just acknowledge 200.
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://agency-dash-production.up.railway.app/api/shopify/webhooks"
